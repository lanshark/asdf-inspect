[build-system]
requires = ['uv_build>=0.9,<0.14']
build-backend = 'uv_build'

[project]
name = 'asdf-inspect'
version = '0.2.0'
description = 'An auxiliary library for the virtualenv-asdf and tox-asdf-redux plugins'
license = 'MIT'
license-files = ['LICENSE']
authors = [{name = 'Scott Sharkey', email = 'me@undef.im'}]
readme = 'README.md'
requires-python = '>=3.11'
keywords = ['asdf']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Software Development :: Libraries',
    'Topic :: Utilities',
]

[project.urls]
Homepage = 'https://github.com/lanshark/asdf-inspect'
Repository = 'https://github.com/lanshark/asdf-inspect'

[dependency-groups]
dev = [
    'pytest>=8',
    'pytest-cov>=6',
    'flake8>=7',
    'isort>=6',
    'tox>=4.22',
    'tox-uv>=1.11',
]

[tool.isort]
lines_after_imports = 2
multi_line_output = 5
include_trailing_comma = true
use_parentheses = true
sections = ['FUTURE', 'STDLIB', 'THIRDPARTY', 'FIRSTPARTY', 'TESTS', 'LOCALFOLDER']
known_first_party = ['asdf_inspect']
known_tests = ['tests']

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']

[tool.coverage.run]
source = ['asdf_inspect']
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.tox]
requires = ['tox>=4.22', 'tox-uv>=1.11']
env_list = ['3.11', '3.12', '3.13', '3.14', '3.15', 'flake8', 'isort']

[tool.tox.env_run_base]
runner = 'uv-venv-lock-runner'
dependency_groups = ['dev']
commands = [['pytest', {replace = 'posargs', extend = true}]]

[tool.tox.env.flake8]
skip_install = true
commands = [['flake8', {replace = 'posargs', extend = true}]]

[tool.tox.env.isort]
skip_install = true
commands = [['isort', {replace = 'posargs', default = ['.', '-c'], extend = true}]]
